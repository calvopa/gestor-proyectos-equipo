services:
  gestor:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - gestor-data:/data
      - /home/alteor/.ssh/id_gestor:/root/.ssh/id_gestor:ro
      - /home/alteor/.ssh/known_hosts:/root/.ssh/known_hosts:ro
    environment:
      - PORT=${PORT:-3000}
      - DB_PATH=/data/gestor.sqlite
      - CLICKUP_TOKEN=${CLICKUP_TOKEN:-}
      - CLICKUP_TEAM_ID=${CLICKUP_TEAM_ID:-}
      - SYNC_INTERVAL_MIN=${SYNC_INTERVAL_MIN:-30}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - AUTH_USER=${AUTH_USER:-}
      - AUTH_PASS=${AUTH_PASS:-}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - OPENCLAW_SSH_HOST=alteor@192.168.1.38
      - OPENCLAW_SSH_KEY=/root/.ssh/id_gestor
      - OLLAMA_URL=${OLLAMA_URL:-http://192.168.1.38:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${PORT:-3000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - demos_network

volumes:
  gestor-data:
    name: gestor-proyectos-data

networks:
  demos_network:
    external: true
